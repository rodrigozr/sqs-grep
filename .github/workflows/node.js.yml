name: Node.js CI

on:
  push:
    branches: [ "master" ]
    tags:
      - v**
  pull_request:
    branches: [ "master" ]
env:
  RUN_INTEGRATION_TESTS: 1
  
jobs:
  build:
    runs-on: ubuntu-latest

    # 'id-token: write' is required for npm trusted publishing (OIDC): without it
    # GitHub does not mint an OIDC token, so 'npm publish' cannot authenticate and
    # fails with a "404 Not Found - PUT" from the registry.
    # 'contents: write' is needed by the "Create github release" step below.
    # Note: the Docker image is built by the 'docker' job below, which only runs
    # once this job has succeeded.
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        # Trusted publishing (OIDC) requires Node >= 22.14.0 and npm >= 11.5.1
        node-version: 24.21.0
        registry-url: https://registry.npmjs.org/
        cache: 'npm'
    
    # Install packages
    - name: Install packages
      run: npm ci

    # Build and test
    - name: Build and test
      run: npm test
    
    # Upload report to Coveralls
    - name: Upload report to Coveralls
      uses: coverallsapp/github-action@v2

    # Create github release
    - name: Create github release
      if: startsWith(github.event.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3

    # Publish to NPM Registry
    - name: Publish to NPM Registry
      if: startsWith(github.event.ref, 'refs/tags/v')
      run: npm publish --provenance --access public

  # Build the Docker image and, on version tags, publish it to Docker Hub. This
  # runs as a separate job so that it only ever starts after the build above has
  # succeeded, which also means an image is never published for a failed release.
  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
    # A called workflow cannot be granted more than the calling job, so the
    # permissions its buildx attestations need are declared here as well.
    permissions:
      contents: read
      id-token: write
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
