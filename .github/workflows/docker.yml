name: Docker

# This workflow is not triggered directly: it is called by the "Node.js CI"
# workflow (see node.js.yml) once the test suite has passed, so that a broken
# build can never publish an image. Being a called workflow also means that the
# event payload - and therefore 'github.event.ref' and the semver tags derived
# from it below - is exactly the same as in the calling workflow.
on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        description: Docker Hub access token. Only used when publishing a version tag.
        required: false

env:
  # Docker Hub image published on version tags. Only DOCKERHUB_TOKEN needs to be
  # configured as a repository secret - the namespace below is public information.
  DOCKERHUB_IMAGE: rodrigozr/sqs-grep
  DOCKERHUB_USERNAME: rodrigozr

jobs:
  docker:
    runs-on: ubuntu-latest

    # 'id-token: write' lets buildx attach provenance attestations to the
    # published image. Note that Docker Hub itself cannot use OIDC here - it is
    # limited to organization accounts on a paid plan - hence DOCKERHUB_TOKEN.
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Docker meta
      id: docker-meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKERHUB_IMAGE }}
        # A 'v2.3.4' tag publishes 2.3.4, 2.3, 2 and latest. Pre-release tags
        # (v2.3.4-beta.1) only ever publish their own full version.
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
      env:
        # Multi-platform images need the annotations on the image index as well
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

    # Build the image and make sure it runs, on every single run, so that a
    # broken Dockerfile fails the build before anything can be published.
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        # 'context: .' uses the checked-out working tree (and its .dockerignore)
        # instead of re-fetching the Git context
        context: .
        load: true
        tags: sqs-grep:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: docker run --rm sqs-grep:ci --version

    # Publish the image to Docker Hub, on version tags only
    - name: Login to Docker Hub
      if: startsWith(github.event.ref, 'refs/tags/v')
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Publish to Docker Hub
      if: startsWith(github.event.ref, 'refs/tags/v')
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.docker-meta.outputs.tags }}
        labels: ${{ steps.docker-meta.outputs.labels }}
        annotations: ${{ steps.docker-meta.outputs.annotations }}
        # Supply-chain attestations, matching the '--provenance' used for NPM
        provenance: mode=max
        sbom: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
